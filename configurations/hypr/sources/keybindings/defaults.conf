bind = CTRL ALT, T, exec, uwsm app -- ghostty
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, Q, exit,
bind = SUPER, F, togglefloating,
bind = SUPER, P, pseudo,
bind = SUPER, S, togglesplit,

# launcher
bind = SUPER, SPACE, exec, uwsm app -- rofi -show combi | xargs hyprctl dispatch exec --
# clipboard history
bind = SUPER, V, exec, uwsm app -- cliphist list | rofi -dmenu | cliphist decode | wl-copy

# filemanager
bind = CTRL ALT, F, exec, uwsm app -- nautilus

# lock
bind = SUPER SHIFT, L, exec, uwsm app -- hyprlock
bind = SUPER SHIFT, W, exec, uwsm app -- wlogout

# color picker
bind = SUPER ALT, C, exec, uwsm app -- hyprpicker -a

# screen shots
bind = SUPER SHIFT, S, exec, uwsm app -- hyprshot -m region
