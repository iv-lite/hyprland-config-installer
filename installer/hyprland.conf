input {
    kb_layout = ch
    kb_variant = fr
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true

    accel_profile = adaptive
    follow_mouse = 1
    natural_scroll = true

    sensitivity = 0 # -1.0 -1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

exec-once = foot -- installer/install.sh; hyprctl dispatch exit